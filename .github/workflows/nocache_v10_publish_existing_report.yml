name: Publish existing no-cache V10 validation report

on:
  workflow_dispatch:
  push:
    branches:
      - opt/wufan-nocache-v10
    paths:
      - '.github/workflows/nocache_v10_publish_existing_report.yml'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40654351402
          pattern: nocache-v10-*
          path: downloaded
      - name: Emit compact metrics from the completed validation run
        run: |
          set -euo pipefail
          residual=$(find downloaded -type f -name distillation_report.json -print -quit)
          retirement=$(find downloaded -type f -name asset_retirement_gate.json -print -quit)
          connector=$(find downloaded -type f -name connector_gate.json -print -quit)
          test -n "$residual" && test -n "$retirement" && test -n "$connector"
          reports=$(dirname "$connector")
          python3 tools/summarize_nocache_validation.py \
            --reports "$reports" --residual "$residual" \
            --output /tmp/nocache_v10_ci_summary.json --annotations
          python3 tools/summarize_nocache_validation.py \
            --retirement "$retirement" \
            --output /tmp/nocache_v10_release_summary.json --annotations
