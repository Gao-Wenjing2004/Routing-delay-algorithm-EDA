name: Publish existing no-cache V10 validation report

on:
  workflow_dispatch:
  push:
    branches:
      - opt/wufan-nocache-v10
    paths:
      - '.github/workflows/nocache_v10_publish_existing_report.yml'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40654351402
          pattern: nocache-v10-*
          path: downloaded
      - name: Emit compact metrics from the completed validation run
        run: |
          set -euo pipefail
          residual=$(find downloaded -type f -name distillation_report.json -print -quit)
          retirement=$(find downloaded -type f -name asset_retirement_gate.json -print -quit)
          connector=$(find downloaded -type f -name connector_gate.json -print -quit)
          p10_up=$(find downloaded/nocache-v10-p10-up -type f -name packing.json -print -quit)
          p10_down=$(find downloaded/nocache-v10-p10-down -type f -name packing.json -print -quit)
          test -n "$residual" && test -n "$retirement" && test -n "$connector" \
            && test -n "$p10_up" && test -n "$p10_down"
          reports=$(dirname "$connector")
          python3 tools/summarize_validation_public.py \
            --reports "$reports" --residual "$residual" --retirement "$retirement" \
            --p10-up "$p10_up" --p10-down "$p10_down"
