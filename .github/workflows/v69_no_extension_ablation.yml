name: V69 no-extension Linux timing ablation

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/linux-unique-10m-100m
    paths:
      - .github/workflows/v69_no_extension_ablation.yml
      - benchmark_assets/endpoint_pool.zip
      - source/**
      - tools/unique_eval.py
      - tests/test_unique_eval.py

permissions:
  contents: write

concurrency:
  group: v69-no-extension-ablation
  cancel-in-progress: false

jobs:
  linux-timing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Verify endpoint pool, build V69, and validate evaluator
        shell: bash
        run: |
          set -euo pipefail
          echo '2657E2E6983D6356EF8EBB5FF20B469A2D264045A6D2E89BA44662DCCCC541E3  benchmark_assets/endpoint_pool.zip' | sha256sum -c -
          mkdir -p bin benchmark_work benchmark_outputs analysis/unique_eval/v69/linux_components
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread source/release_v69.cpp -o bin/estimate_v69
          strip bin/estimate_v69
          chmod 755 bin/estimate_v69
          file bin/estimate_v69
          sha256sum bin/estimate_v69 > analysis/unique_eval/v69/estimate_v69_linux.sha256
          python3 -m unittest tests.test_unique_eval -v
          unzip -q benchmark_assets/endpoint_pool.zip -d benchmark_work

      - name: Generate and benchmark 10M cold plus warm
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 4096
          python3 tools/unique_eval.py generate-perf \
            --pool benchmark_work/delay_estimate_ans.csv \
            --output benchmark_work/perf_10m.csv \
            --manifest analysis/unique_eval/v69/perf_10m.manifest.json \
            --sources 10000 --targets-per-source 1000 \
            --profile official-like --seed 20261030 --shuffle-seed 20261100 \
            --fold-count 5 --fold-index 0 --buckets 1024
          rm -f /tmp/srb_runtime_atlas_v69.bin /tmp/srb_runtime_atlas_v69.bin.lock
          python3 tools/unique_eval.py benchmark \
            --executable bin/estimate_v69 \
            --input benchmark_work/perf_10m.csv \
            --output-dir benchmark_outputs \
            --report analysis/unique_eval/v69/linux_components/perf_10m.json \
            --runs 5 --timeout 3600 --cold-first-run
          rm -f benchmark_work/perf_10m.csv

      - name: Generate and benchmark 50M warm
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/unique_eval.py generate-perf \
            --pool benchmark_work/delay_estimate_ans.csv \
            --output benchmark_work/perf_50m.csv \
            --manifest analysis/unique_eval/v69/perf_50m.manifest.json \
            --sources 50000 --targets-per-source 1000 \
            --profile official-like --seed 20261030 --shuffle-seed 20261101 \
            --fold-count 5 --fold-index 1 --buckets 1024
          python3 tools/unique_eval.py benchmark \
            --executable bin/estimate_v69 \
            --input benchmark_work/perf_50m.csv \
            --output-dir benchmark_outputs \
            --report analysis/unique_eval/v69/linux_components/perf_50m.json \
            --runs 5 --timeout 3600
          rm -f benchmark_work/perf_50m.csv

      - name: Generate and benchmark 100M warm
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/unique_eval.py generate-perf \
            --pool benchmark_work/delay_estimate_ans.csv \
            --output benchmark_work/perf_100m.csv \
            --manifest analysis/unique_eval/v69/perf_100m.manifest.json \
            --sources 100000 --targets-per-source 1000 \
            --profile official-like --seed 20261030 --shuffle-seed 20261102 \
            --fold-count 5 --fold-index 2 --buckets 1024
          python3 tools/unique_eval.py benchmark \
            --executable bin/estimate_v69 \
            --input benchmark_work/perf_100m.csv \
            --output-dir benchmark_outputs \
            --report analysis/unique_eval/v69/linux_components/perf_100m.json \
            --runs 5 --timeout 3600
          rm -f benchmark_work/perf_100m.csv

      - name: Combine timing and enforce unique-input gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/unique_eval.py combine-benchmarks \
            --input analysis/unique_eval/v69/linux_components/perf_10m.json \
            --input analysis/unique_eval/v69/linux_components/perf_50m.json \
            --input analysis/unique_eval/v69/linux_components/perf_100m.json \
            --report analysis/unique_eval/v69/v69_linux_unique_10m_100m.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('analysis/unique_eval/v69')
          timing = json.loads((root / 'v69_linux_unique_10m_100m.json').read_text())
          assert timing['formal_timing_gate'] is True, timing
          assert timing['reference_quality'] == 'release-reference', timing
          assert timing['all_consistent'] is True, timing
          expected = {'perf_10m': 10_000_000, 'perf_50m': 50_000_000, 'perf_100m': 100_000_000}
          for stem, rows in expected.items():
              manifest = json.loads((root / f'{stem}.manifest.json').read_text())
              assert manifest['rows'] == rows, manifest
              assert manifest['duplicate_pairs'] == 0, manifest
              assert manifest['one_row_per_source_per_bucket'] is True, manifest
              assert manifest['order_diagnostics']['adjacent_same_source_rows'] == 0, manifest
              assert manifest['order_diagnostics']['max_consecutive_same_source'] == 1, manifest
          seconds = timing['extrapolation']['estimate_seconds']
          baseline = 185.55946525399884
          summary = {
              'baseline_v68_center_seconds': baseline,
              'v69_center_seconds': seconds,
              'seconds_delta': seconds - baseline,
              'time_score_delta': (baseline - seconds) / 120.0,
              'accuracy_status': 'pending local 608K source-disjoint Golden validation',
          }
          (root / 'v69_vs_v68_timing.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

      - name: Publish small reports to benchmark branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/unique_eval/v69
          git commit -m 'benchmark: publish V69 no-extension timing [skip ci]'
          git push

      - name: Upload Linux candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v69-no-extension-linux
          path: |
            bin/estimate_v69
            analysis/unique_eval/v69/
          if-no-files-found: warn
          retention-days: 14

  windows-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Build native Windows V69 for local private-Golden validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          clang++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off source/release_v69.cpp -o bin/estimate_v69_windows.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows V69 compile failed: $LASTEXITCODE" }
          Get-FileHash bin/estimate_v69_windows.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows candidate only
        uses: actions/upload-artifact@v4
        with:
          name: v69-no-extension-windows
          path: bin/estimate_v69_windows.exe
          if-no-files-found: error
          retention-days: 14
