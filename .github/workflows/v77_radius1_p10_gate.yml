name: V77 radius1 plus P10 release gate

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/linux-unique-10m-100m
    paths:
      - .github/workflows/v77_radius1_p10_gate.yml
      - source/release_v77.cpp

permissions:
  contents: read
  actions: read

concurrency:
  group: v77-radius1-p10-gate
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download validated P10 closure
        uses: actions/download-artifact@v4
        with:
          name: p10-portal-up-packed
          path: p10/up
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40496834812
      - uses: actions/download-artifact@v4
        with:
          name: p10-portal-down-packed
          path: p10/down
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40496834812

      - name: Build V69 control and V77
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build bin benchmark_work/public benchmark_outputs \
            analysis/unique_eval/local_route_packing \
            analysis/unique_eval/p10_rebuild/up \
            analysis/unique_eval/p10_rebuild/down \
            analysis/unique_eval/v77
          cp p10/up/packed_1_5.bin analysis/unique_eval/p10_rebuild/up/packed_1_5.bin
          cp p10/down/packed_1_5.bin analysis/unique_eval/p10_rebuild/down/packed_1_5.bin
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            tools/build_exact_local_route_table.cpp \
            -o build/build_exact_local_route_table
          build/build_exact_local_route_table \
            analysis/unique_eval/local_route_packing/exact_local_route_table.bin 1
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            source/release_v69.cpp -o bin/estimate_v69
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            source/release_v77.cpp source/exact_local_route_data.S \
            source/p10_periodic_portal_data.S -o bin/estimate_v77
          strip bin/estimate_v69 bin/estimate_v77
          bytes=$(stat --printf='%s' bin/estimate_v77)
          test "${bytes}" -lt 100000000
          printf 'v77_bytes=%s\nremaining_bytes=%s\n' \
            "${bytes}" "$((100000000-bytes))" \
            > analysis/unique_eval/v77/build.txt
          sha256sum bin/estimate_v77 >> analysis/unique_eval/v77/build.txt
          sha256sum analysis/unique_eval/local_route_packing/exact_local_route_table.bin \
            >> analysis/unique_eval/v77/build.txt

      - name: Prepare public and independent requests
        shell: bash
        run: |
          set -euo pipefail
          unzip -q benchmark_assets/endpoint_pool.zip -d benchmark_work/public
          python3 - <<'PY'
          import csv
          from pathlib import Path
          golden = Path("benchmark_work/public/delay_estimate_ans.csv")
          request = Path("benchmark_work/public_requests.csv")
          with golden.open(encoding="utf-8-sig", newline="") as source, \
               request.open("w", encoding="utf-8", newline="") as target:
              reader = csv.DictReader(source)
              writer = csv.writer(target, lineterminator="\n")
              writer.writerow(["From", "To"])
              for row in reader:
                  writer.writerow([row["From"], row["To"]])
          PY
          zstd -q -d -c benchmark_assets/unique_teacher_requests_608k.csv.zst \
            > benchmark_work/independent_requests.csv
          zstd -q -d -c benchmark_assets/unique_teacher_golden_608k.csv.zst \
            > benchmark_work/independent_golden.csv

      - name: Require V69-equivalent predictions on both panels
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/srb_runtime_atlas_v69.bin /tmp/srb_runtime_atlas_v69.bin.lock
          rm -f /tmp/srb_runtime_atlas_v77.bin /tmp/srb_runtime_atlas_v77.bin.lock
          bin/estimate_v69 -in benchmark_work/public_requests.csv -out benchmark_work/public_v69.csv
          bin/estimate_v77 -in benchmark_work/public_requests.csv -out benchmark_work/public_v77.csv
          python3 tools/compare_prediction_accuracy.py \
            --golden benchmark_work/public/delay_estimate_ans.csv \
            --control benchmark_work/public_v69.csv \
            --candidate benchmark_work/public_v77.csv \
            --output analysis/unique_eval/v77/public_delta.json
          bin/estimate_v69 -in benchmark_work/independent_requests.csv -out benchmark_work/independent_v69.csv
          bin/estimate_v77 -in benchmark_work/independent_requests.csv -out benchmark_work/independent_v77.csv
          python3 tools/compare_prediction_accuracy.py \
            --golden benchmark_work/independent_golden.csv \
            --control benchmark_work/independent_v69.csv \
            --candidate benchmark_work/independent_v77.csv \
            --output analysis/unique_eval/v77/independent_delta.json
          cmp benchmark_work/public_v69.csv benchmark_work/public_v77.csv
          cmp benchmark_work/independent_v69.csv benchmark_work/independent_v77.csv

      - name: Preliminary 10M cold and warm timing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/unique_eval.py generate-perf \
            --pool benchmark_work/public/delay_estimate_ans.csv \
            --output benchmark_work/perf_10m.csv \
            --manifest analysis/unique_eval/v77/perf_10m.manifest.json \
            --sources 10000 --targets-per-source 1000 \
            --profile official-like --seed 20261030 --shuffle-seed 20261100 \
            --fold-count 5 --fold-index 0 --buckets 1024
          rm -f /tmp/srb_runtime_atlas_v77.bin /tmp/srb_runtime_atlas_v77.bin.lock
          python3 tools/unique_eval.py benchmark \
            --executable bin/estimate_v77 \
            --input benchmark_work/perf_10m.csv \
            --output-dir benchmark_outputs \
            --report analysis/unique_eval/v77/perf_10m.json \
            --runs 3 --timeout 3600 --cold-first-run

      - name: Upload V77 binary and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v77-radius1-p10-linux
          path: |
            bin/estimate_v77
            analysis/unique_eval/v77/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
