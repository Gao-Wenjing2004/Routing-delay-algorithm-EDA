name: Exact local route packing audit

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/linux-unique-10m-100m
    paths:
      - .github/workflows/local_route_packing_audit.yml
      - tools/audit_exact_local_route_packing.cpp
      - tools/build_exact_local_route_table.cpp
      - tools/validate_exact_local_route_table.cpp
      - source/exact_local_route_table.hpp
      - source/exact_local_route_data.S
      - source/release_v72.cpp
      - source/srb_hybrid.hpp
      - source/estimate_v30.cpp
      - source/local_arch_data.hpp
      - source/runtime_atlas_builder.hpp

permissions:
  contents: read

concurrency:
  group: exact-local-route-packing-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build exact local-table tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build analysis/unique_eval/local_route_packing
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            tools/audit_exact_local_route_packing.cpp \
            -o build/audit_exact_local_route_packing
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            tools/build_exact_local_route_table.cpp \
            -o build/build_exact_local_route_table
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            tools/validate_exact_local_route_table.cpp \
            -o build/validate_exact_local_route_table
      - name: Build and validate augmented direct-mapped table
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v build/build_exact_local_route_table \
            analysis/unique_eval/local_route_packing/exact_local_route_table.bin \
            2> analysis/unique_eval/local_route_packing/build_table_resource_usage.txt
          validation_status=0
          /usr/bin/time -v build/validate_exact_local_route_table \
            analysis/unique_eval/local_route_packing/exact_local_route_table.bin \
            analysis/unique_eval/local_route_packing/validation.json \
            2> analysis/unique_eval/local_route_packing/validation_resource_usage.txt \
            || validation_status=$?
          sha256sum analysis/unique_eval/local_route_packing/exact_local_route_table.bin \
            > analysis/unique_eval/local_route_packing/exact_local_route_table.sha256
          cat analysis/unique_eval/local_route_packing/validation.json
          cat analysis/unique_eval/local_route_packing/exact_local_route_table.sha256
          cat analysis/unique_eval/local_route_packing/build_table_resource_usage.txt
          cat analysis/unique_eval/local_route_packing/validation_resource_usage.txt
          echo "validation_exit=${validation_status}"
      - name: Require exact connector equivalence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "analysis/unique_eval/local_route_packing/validation.json"
          ).read_text())
          if report["sampled"] != report["exact"]:
              raise SystemExit(
                  f"not exact: {report['exact']}/{report['sampled']} "
                  f"under={report['under']} over={report['over']}"
              )
          PY
      - name: Build and smoke-test V72 hot-only Atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -std=c++17 -O3 -DNDEBUG -ffp-contract=off -pthread \
            source/release_v72.cpp source/exact_local_route_data.S \
            -o bin/estimate_v72
          strip bin/estimate_v72
          candidate_bytes=$(stat --printf='%s' bin/estimate_v72)
          if (( candidate_bytes >= 100000000 )); then
            echo "V72 exceeds submission limit: ${candidate_bytes}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import csv
          import io
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("benchmark_assets/endpoint_pool.zip") as archive:
              name = next(name for name in archive.namelist() if name.endswith(".csv"))
              text = io.TextIOWrapper(archive.open(name), encoding="utf-8", newline="")
              row = next(csv.DictReader(text))
          with Path("analysis/unique_eval/local_route_packing/smoke.csv").open(
              "w", encoding="utf-8", newline=""
          ) as stream:
              writer = csv.writer(stream, lineterminator="\n")
              writer.writerow(["From", "To"])
              writer.writerow([row["From"], row["To"]])
          PY
          rm -f /tmp/srb_runtime_atlas_v72.bin /tmp/srb_runtime_atlas_v72.bin.lock
          bin/estimate_v72 \
            -in analysis/unique_eval/local_route_packing/smoke.csv \
            -out analysis/unique_eval/local_route_packing/smoke_prediction.csv
          printf 'candidate_bytes=%s\n' "${candidate_bytes}" \
            > analysis/unique_eval/local_route_packing/v72_build.txt
          sha256sum bin/estimate_v72 \
            >> analysis/unique_eval/local_route_packing/v72_build.txt
          cat analysis/unique_eval/local_route_packing/v72_build.txt
          cat analysis/unique_eval/local_route_packing/smoke_prediction.csv
      - name: Upload aggregate packing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-local-route-packing-audit
          path: |
            build/audit_exact_local_route_packing
            build/build_exact_local_route_table
            build/validate_exact_local_route_table
            analysis/unique_eval/local_route_packing/exact_local_route_table.sha256
            analysis/unique_eval/local_route_packing/validation.json
            analysis/unique_eval/local_route_packing/build_table_resource_usage.txt
            analysis/unique_eval/local_route_packing/validation_resource_usage.txt
            analysis/unique_eval/local_route_packing/v72_build.txt
            analysis/unique_eval/local_route_packing/smoke_prediction.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated direct-mapped table
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exact-local-route-table-bin
          path: analysis/unique_eval/local_route_packing/exact_local_route_table.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload V72 Linux candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v72-exact-local-linux
          path: bin/estimate_v72
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
